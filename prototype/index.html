const claim = id => DB.claims.find(x => x.id === id);
const req = id => DB.reqs.find(x => x.id === id);
const srcName = id => { const s = src(id); return s ? s.name : '—'; };

const taskLink = id => { const t = task(id); return t ? `<a href="#/task/${id}">${esc(t.question)}</a>` : '—'; };
const parentLink = id => `由探究任务 ${taskLink(id)} 催生`;

const citeLink = id => item(id) ? itemLink(id) : (claim(id) ? claimLink(id) : '—');

const ratingPill = r => r ? `<span class="pill rating">${esc(r)}</span>` : '<span class="pill dashed">未评级</span>';

function route(){
  const h = location.hash.replace(/^#\/?/, '') || 'inbox';
  const [page, id] = h.split('/');
  return {page, id};
}
function renderNav(active){
  const links = [['inbox','收件箱'],['items','情报条目'],['tasks','探究任务'],['reqs','情报需求'],['sources','信源库']];
  $('#nav').innerHTML = links.map(([p, label]) =>
    `<a href="#/${p}" class="${active===p?'active':''}">${label}${p==='inbox'?`<span class="cnt">${inboxCount()}</span>`:''}</a>`
  ).join('');
}
const PAGES = {
  inbox: renderInbox, items: renderItems, item: renderItemDetail,
  tasks: renderTasks, task: renderTaskDetail,
  reqs: renderReqs, requirement: renderReqDetail,
  sources: renderSources, source: renderSourceDetail, submit: renderSubmit,
};
function render(){
  const {page, id} = route();
  if (!(page === 'item' && id === PENDING_FB)) PENDING_FB = null;   // 事实错误跳详情：仅目标页保留预选
  renderNav(NAV_MAP[page]);
  const fn = PAGES[page] || PAGES.inbox;
  $('#app').innerHTML = id ? fn(id) : fn();
  if (PENDING_FB){ const el = $('#fb-reason-' + PENDING_FB); if (el) el.focus(); }
  window.scrollTo(0, 0);
}

function setItemMode(m){ UI.itemMode = m; render(); }

function fbQuickRow(id){
  const i = item(id);
  if (i.feedbacks.length && ['已消费','作废'].includes(i.status))
    return `<span class="done-note">✓ 已反馈 · ${esc(i.feedbacks[i.feedbacks.length-1].type)}（${esc(i.feedbacks[i.feedbacks.length-1].reason)}）</span>`;
  return FB_TYPES.map(t =>
    t === '事实错误'
      ? `<a class="btn small" href="#/item/${id}" onclick="fbJump('${id}')">事实错误 ↗详情</a>`
      : `<button class="btn small" onclick="fbQuick('${id}','${t}')">${t}</button>`
  ).join('') + `<a class="btn small" href="#/item/${id}">详情</a>`;
}
function fbJump(id){ PENDING_FB = id; render(); }

      <dt>状态</dt><dd>${statusPill(i.status)}</dd>
      <dt>事件时间</dt><dd>${esc(i.eventTime)}</dd>

      <dt>媒介 / 载体</dt><dd>${esc(i.medium)} / ${esc(i.carrier)}</dd>
      <dt>采集模式</dt><dd>${esc(i.mode)}</dd>
      <dt>出处信源</dt><dd>${srcLink(i.provenanceSrc)}</dd>
      <dt>命中情报需求</dt><dd>${i.hits.map(reqLink).join('、') || '—'}</dd>
      <dt>被引用</dt><dd>${i.citedBy.map(c => `${answerLink(c.claim)}<span class="muted">（${esc(c.as)}）</span>`).join('；') || '—'}</dd>

    <h2>${esc(i.stmt)} &nbsp;${statusPill(i.status)} ${ratingPill(i.rating)} ${i.indepCount!=null?`<span class="pill">独立信源 ×${i.indepCount}</span>`:''}</h2>
    <h3>状态迁移</h3>
    <div class="muted">${i.trail.map(t => `${esc(t.t)}<span class="muted">（${esc(t.time)}）</span>`).join(' <span class="arrow">→</span> ')}</div>
  </div>

  <div class="box"><h2>元数据</h2>${meta}</div>

  <div class="box"><h2>独立信源计数</h2>
    <div>穿透转引链后：<b>${i.indepCount!=null?`×${i.indepCount}`:'—'}</b>
      ${i.indep.length?`（${i.indep.map(srcLink).join('、')}）`:''}</div>
    <div class="muted" style="margin-top:4px">N 家转载同一通稿 = 1 个独立信源（术语表 · 独立信源）。</div>

  <div class="sketch"><h2 style="font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center">转引链穿透视图 <span class="sketch-tag">草图 · 实现时按真实数据重画</span></h2>

      <div style="margin-bottom:8px"><span class="muted">链 ${esc(c)}</span>

        <li class="${n===0?'first':''}">
          ${srcLink(p.src)} <span class="pill">${esc(p.role)}</span>
          <span class="muted">${esc(p.time)} · 载体 ${esc(p.carrier)}
          ${p.src===i.provenanceSrc?' · <b>信用归因对象（最早引入方 · decision-08）</b>':''}</span>
          <span class="stub" title="原文快照仅内部留存用于溯源（立项 §8），分发携带链接而非快照本体">原文快照</span>
        </li>`).join('')}</ul></div>`).join('')}
    <div class="muted">转引链 = 载体 → … → 原始信源；核实与独立性判断的依据（术语表）。</div>
  </div>

  ${i.ratingHistory.length ? `
  <div class="sketch"><h2 style="font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center">评级历史（版本化 · 可重放） <span class="sketch-tag">草图 · 实现时按真实数据重画</span></h2>
    <table>
      <tr><th>版本</th><th>时间</th><th>评级</th><th>依据</th></tr>
      ${i.ratingHistory.map(r => `
        <tr><td>${r.v?`v${r.v}`:'—'}</td><td class="muted">${esc(r.time)}</td>
        <td>${r.rating==='作废'?statusPill('作废'):ratingPill(r.rating)}</td>
        <td class="muted">${esc(r.basis)}${r.current?' <b>（当前）</b>':''}</td></tr>`).join('')}
    </table>
    <div class="muted" style="margin-top:6px">重评触发器：新印证合并｜信源信用分档迁移｜人工触发｜评级异议（decision-07）；下游引用取当前值。</div>
  </div>` : ''}

  ${i.pipe ? `
  <div class="box"><h2>管线进度（线索 → 审查 → 核实评级）</h2>
    <ul class="pipe">${i.pipe.map(p => `
      <li><span class="st ${p.state}">${p.state==='done'?'✓':p.state==='doing'?'●':'○'}</span>

    ${i.status==='线索'||i.status==='候选情报' ? `

    <div class="field"><label>反馈类型（六类型 · 领域模型 §6）</label>
      <select id="fb-type-${i.id}">

      </select></div>
    <div class="field"><label>理由（事实错误必填 · 其余可空，空则记「快捷 · {类型}」· decision-11）</label>
      <textarea id="fb-reason-${i.id}" placeholder="${PENDING_FB===i.id?'必填：请说明事实错误的依据':''}"></textarea></div>
    <div class="err" id="fb-err-${i.id}" hidden>事实错误理由必填。</div>
    <button class="btn primary" onclick="fbSubmit('${i.id}')">提交反馈</button>
  </div>` : `
  <div class="box"><h2>反馈</h2><div class="muted">当前状态（${esc(i.status)}）不开放反馈——反馈挂载于已分发 / 已消费等消费现场（doc-07 §4）。</div></div>`}

  <div class="box"><h2>反馈记录</h2>
    ${i.feedbacks.length ? i.feedbacks.map(f => `
      <div style="border-bottom:1px solid #eee;padding:8px 0">
        ${fbTypePill(f.type)} <span class="muted">${esc(f.time)}</span>

        <div class="muted">路由：${esc(f.routing)}</div>
      </div>`).join('') : '<div class="empty">暂无反馈</div>'}
  </div>`;
}

/* ================= 探究任务 ================= */
function renderTasks(){
  const groups = ['进行中','已结题'];
  return `
  <h1 class="page">探究任务</h1>
  <div class="sub">问题的一等容器，可递归分解为子探究任务（问题树 · decision-15）：问题陈述 + 候选答案与判定 + 方法学附件 + 催生的任务型需求/子任务 + 工作台聚合（decision-13/14/15）。子任务在父任务工作台展开，不入顶层列表。</div>
  <div class="box">
    ${groups.map(g => {
      const list = DB.tasks.filter(t => t.status === g && !t.parent);
      if (!list.length) return '';
      return `<h3 style="margin:10px 0 4px">${g} <span class="muted">× ${list.length}</span></h3>
      <table>
        <tr><th>问题</th><th>答案（命题）</th><th>催生需求</th><th>创建</th><th>登记方</th></tr>
        ${list.map(t => `
          <tr><td><a href="#/task/${t.id}">${esc(t.question)}</a></td>
          <td>${t.claims.map(cid => { const c = claim(cid); return `<a href="#/task/${t.id}" title="${esc(c.stmt)}">${cid.toUpperCase()}·${esc(c.status)}</a>`; }).join('、') || '<span class="muted">—（未设候选答案）</span>'}</td>
          <td class="muted">${t.spawnedReqs.length?t.spawnedReqs.map(reqLink).join('、'):'—'}</td>
          <td class="muted">${esc(t.created)}</td>
          <td class="muted">${esc(t.registrant)}</td></tr>`).join('')}
      </table>`;
    }).join('') || '<div class="empty">暂无探究任务</div>'}
  </div>
  <div class="box"><h2>登记探究任务</h2>
    <div class="field"><label>问题陈述（问句——候选答案是可判真假的陈述，答案在工作台落成）</label>
      <textarea id="task-question" placeholder="例：某细分市场空间有多大？"></textarea></div>
    <div class="field"><label>转写首个候选答案（可选——判断题是答案形态为「是/否」的问题；估算类可不转写，竞争情形记场景草稿）</label>
      <input type="text" id="task-hypo" placeholder="例：该市场空间在 A–B 亿元区间（留空则本任务暂不含候选答案）"></div>
    <div class="field"><label><input type="checkbox" id="task-att" style="width:auto"> 挂载方法学附件（指标清单 / 测算框架 / 信源指引 · decision-12，单轨挂探究任务）</label></div>
    <button class="btn primary" onclick="taskRegister()">登记</button>
    <div class="muted" style="margin-top:8px">候选答案可选：世界递来的断言顺手包成问题（登记时转写）；自己的问题等测算完成在工作台作答（登记即判定）。</div>
  </div>`;
}

function renderTaskDetail(id){
  const t = task(id); if (!t) return '<div class="empty">探究任务不存在</div>';
  const claims = t.claims.map(claim);
  const hitItems = t.attachment ? [...new Set(t.attachment.metrics.filter(m => m.ev).map(m => m.ev))] : [];
  const judging = claims.filter(c => c.status === '假设' && c.evidence.length);
  const diffClaim = claims.find(c => c.diff);
  const reasoning = claims.flatMap(c => c.reasoning.map(r => ({...r, cid:c.id}))).sort((a,b) => b.time.localeCompare(a.time));
  return `
  <h1 class="page"><a href="#/tasks">探究任务</a> / 工作台</h1>
  <div class="sub">任务探究期间的工作台停留点（doc-07 §1 项目式节奏）：候选答案与判定、场景草稿、方法学附件、命中条目一屏聚合（decision-14）。</div>

  <div class="box">
    <h2>${esc(t.question)} &nbsp;${statusPill(t.status)}</h2>
    <div class="muted">创建 ${esc(t.created)} · 登记方 ${esc(t.registrant)} · 判定机制内聚于此：判定、置信度、推理记录、反馈以单个答案为单位（decision-14）。</div>
    ${t.status==='进行中'?`<div class="fbrow" style="margin-top:8px"><button class="btn small" onclick="taskClose('${t.id}')">结题（问题已回答或放弃 · 历史保留）</button></div>`:''}
  </div>

  ${t.parent || (t.children && t.children.length) ? `
  <div class="box"><h2>任务树（问题树 · decision-15）</h2>
    ${t.parent ? `<div class="muted">${taskParentLink(t.parent)}（子任务）</div>` : ''}
    ${t.children && t.children.length ? `
      <h3>子任务（按方法分解）</h3>
      <table>
        <tr><th>子任务</th><th>子结论</th><th>状态</th><th>置信度</th></tr>
        ${t.children.map(cid => { const ct = task(cid); const cc = ct.claims.map(claim)[0] || null; return `
          <tr><td><a href="#/task/${cid}">${esc(ct.question)}</a></td>
          <td>${cc?esc(cc.stmt):'—'}</td>
          <td>${cc?statusPill(cc.status):'—'}</td>
          <td>${cc&&cc.confidence?esc(cc.confidence):'—'}</td></tr>`; }).join('')}
      </table>
      <div class="muted" style="margin-top:6px">父结论由分析智能体取子结论按框架合成（非叶子任务从子结论合成 · decision-15）；子结论变 → 父结论级联重估。</div>` : ''}
  </div>` : ''}

  <div class="box"><h2>候选答案与结论（命题 · 可选）</h2>
    ${claims.length ? `<table>
      <tr><th>答案陈述</th><th>状态</th><th>置信度</th><th>证据</th><th>动作</th></tr>
      ${claims.map(c => `
        <tr><td>${esc(c.stmt)}</td>
        <td>${statusPill(c.status)}</td>
        <td>${c.confidence?esc(c.confidence):'—'}</td>
        <td class="muted">${c.evidence.length} 条</td>
        <td>${c.status==='结论'?`<button class="btn small" onclick="claimFbError('${c.id}')">事实错误 → 重估</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')}
    </table>` : '<div class="muted">未设候选答案——估算类可不转写，最终答案作答（登记即判定）落成结论（decision-14）。</div>'}
    <div class="muted" style="margin:6px 0 0">答案状态机：假设 ⇄ 结论 ⇄ 重估中 ⇄ 已证伪（锚点为探究任务的答案，机制不动 · decision-14）；结论反馈仅作用于结论态，非结论态翻案由系统触发。</div>

    <h3 style="margin-top:14px">场景草稿（竞争情形 · 判定前不是答案）</h3>
    ${(t.scenarios||[]).map(s => `<div style="border-bottom:1px solid #eee;padding:6px 0">${esc(s)}</div>`).join('') || '<div class="muted">暂无</div>'}
    <div class="field" style="margin-top:10px"><label>补记场景草稿</label>
      <input type="text" id="task-scenario" placeholder="例：该市场空间在 C–D 亿元区间（另一情形）"></div>
    <button class="btn small" onclick="taskAddScenario('${t.id}')">补记</button>
    <div class="muted" style="margin-top:6px">需被证据长期检验的情形可转写为候选答案；最终答案作答即判定（decision-13/14）。</div>

    ${judging.length ? `
    <h3 style="margin-top:14px">判定（构造性测算 v1 由用户完成）</h3>
    ${judging.map(c => `
      <div class="field"><label>${esc(c.stmt)} —— 测算结果（转结论；判定者记人 · decision-12，置信度仍由公式计算）</label>
        <input type="text" id="judge-val-${c.id}" value="${c.id==='c1'?'128–142 亿元（落在登记区间内 → 证实）':''}"></div>`).join('')}
    <div class="muted" style="margin-bottom:8px">公式 v1 预览：M=2（引用条目数），W=2（最弱条目内容可信度）→ 置信度 <b>高</b>（doc-04 §2.2）。</div>
    ${judging.map(c => `<button class="btn small primary" style="margin-right:6px" onclick="claimJudge('${c.id}')">▶ ${c.id.toUpperCase()} 录入测算结果 → 转结论（原型模拟）</button>`).join('')}
    ` : ''}

    <h3 style="margin-top:14px">作答（登记即判定 · 无候选答案路径）</h3>
    <div class="field"><label>答案陈述（构造性测算 v1 由用户完成 · 判定者记人；登记 + 判定两步并一步，直接落成结论）</label>
      <input type="text" id="task-answer" placeholder="例：该市场空间在 126–140 亿元区间（测算结果）"></div>
    <button class="btn small" onclick="answerRegister('${t.id}')">作答 → 结论</button>
  </div>

  ${diffClaim ? `
  <div class="box"><h2>变化前后对比（${esc(diffClaim.id.toUpperCase())} · 重估中）</h2>
    <table class="diff">
      ${diffClaim.diff.map(d => `<tr><td>${esc(d.obj)}</td><td>${esc(d.before)}</td><td class="arrow">→</td><td><b>${esc(d.after)}</b></td></tr>`).join('')}
    </table>
    <div class="muted" style="margin-top:6px">${esc(diffClaim.alertNote)}</div>
    <div style="margin-top:6px">触发源条目：${itemLink('i4')} <span class="muted">（可反馈事实错误 / 评级异议）</span></div>
  </div>` : ''}

  ${t.attachment ? `
  <div class="box"><h2>方法学附件（单轨挂探究任务 · decision-12/14）</h2>
    <h3>指标清单</h3>
    <table>
      <tr><th>参数</th><th>任务型需求（催生）</th><th>状态</th><th>命中证据</th></tr>
      ${t.attachment.metrics.map(m => `
        <tr><td>${esc(m.no)} ${esc(m.name)}</td>
        <td>${m.req?reqLink(m.req):'<span class="muted">—</span>'}</td>
        <td>${m.state==='已命中'?`<span class="pill">已命中</span>`:`<span class="muted">${esc(m.state)}</span>`}</td>
        <td>${m.ev?itemLink(m.ev):'—'}</td></tr>`).join('')}
    </table>
    <h3>测算框架</h3><div class="muted">${esc(t.attachment.framework)}</div>
    <h3>信源指引</h3><div class="muted">${esc(t.attachment.guide)}</div>
    <div class="muted" style="margin-top:6px">附件是输入供货非判断主体：由记账层组装注入定向（采集依据）与分析（合成框架）的上下文（decision-12）。</div>
  </div>` : ''}

  <div class="box"><h2>催生的任务型需求</h2>
    <div>${t.spawnedReqs.map(reqLink).join('、') || '—'}</div>
    <div class="muted" style="margin-top:4px">v1 由消费方按指标清单落成（一次性，之后无人值守）；定向智能体自动提案落成列 v2（decision-12/14）。生效窗口至本任务结题。</div>
  </div>

  ${reasoning.length ? `
  <div class="sketch"><h2 style="font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center">推理记录（全部答案 · 每次判定落档） <span class="sketch-tag">草图 · 实现时按真实数据重画</span></h2>
    <table>
      <tr><th>时间</th><th>答案</th><th>判定者</th><th>动作</th><th>依据（含公式版本）</th><th>引用</th></tr>
      ${reasoning.map(r => `
        <tr><td class="muted" style="white-space:nowrap">${esc(r.time)}</td><td>${esc(r.cid.toUpperCase())}</td><td>${esc(r.judge)}</td>
        <td>${esc(r.action)}</td><td class="muted">${esc(r.basis)}</td>
        <td>${r.cites.map(citeLink).join('、')||'—'}</td></tr>`).join('')}
    </table>
    <div class="muted" style="margin-top:6px">结论可审计、可级联重估的前提（术语表 · 推理记录）；命题页已撤，记录聚合于工作台（decision-14）。</div>

  ${hitItems.length ? `

        <a href="#/item/${iid}">${esc(i.stmt)}</a> ${statusPill(i.status)} ${ratingPill(i.rating)}
      </div>`; }).join('')}

}

/* ================= 情报需求 ================= */
function renderReqs(){

/* ================= 动作（原型模拟） ================= */
function alertRead(n){ DB.alerts[n].read = true; renderNav('inbox'); }

function applyFeedback(it, type, reason){
  const r = reason && reason.trim() ? reason.trim() : '快捷 · ' + type;
  it.feedbacks.push({type, reason:r, time:'2026-09-08 08:41',
    routing:ROUTING_NOTE[type] + (['有效','事实错误'].includes(type)&&it.attribution&&it.attribution!=='—'?` · 归因：${it.attribution}`:'')});
  if (type === '事实错误'){
    it.status = '作废';
    it.trail.push({t:'作废（事实错误）', time:'2026-09-08 08:41'});
    const cascaded = [];
    DB.claims.forEach(c => {
      if (['结论','已证伪'].includes(c.status) && c.evidence.some(e => e.item === it.id)){
        c.status = '重估中';
        c.reasoning.push({time:'2026-09-08 08:41', judge:'记账层（调度）', action:'级联重估触发：' + it.id + ' 作废 → 进入重估中', basis:'推理记录引用关系', cites:[it.id]});
        cascaded.push(c.id);
      }
    });
    toast('已作废' + (cascaded.length?'，级联重估：'+cascaded.join('、'):'（无结论引用该条目）'));
  } else if (type === '评级异议'){
    if (it.status === '已分发'){ it.status = '已消费'; it.trail.push({t:'已消费（反馈：评级异议）', time:'2026-09-08 08:41'}); }
    it.ratingHistory.push({time:'2026-09-08 08:41', rating:it.rating, basis:'评级异议触发重评（decision-07）· 重评中'});
    toast('已记录评级异议 · 已触发评级重评');
  } else {
    if (it.status === '已分发'){ it.status = '已消费'; it.trail.push({t:'已消费（反馈：' + type + '）', time:'2026-09-08 08:41'}); }
    toast('已记录 ' + type + ' · ' + ROUTING_NOTE[type]);
  }
}
function fbQuick(id, type){
  const it = item(id); if (!it) return;
  if (type === '事实错误'){ PENDING_FB = id; location.hash = '#/item/' + id; render(); return; }
  applyFeedback(it, type, null);
  refresh();
}
function fbSubmit(id){
  const it = item(id); if (!it) return;
  const type = $('#fb-type-' + id).value;
  const reason = $('#fb-reason-' + id).value;
  if (type === '事实错误' && !reason.trim()){
    const err = $('#fb-err-' + id); err.hidden = false; return;
  }
  PENDING_FB = null;
  applyFeedback(it, type, reason);
  refresh();
}

  s.fb = {valid:0, factual:0, last:'—'};

  toast('已确认入信源库 · 开始建画像与记账');

  DB.sources.push({id:'s' + (DB.sources.length + 1), name, type:$('#src-type').value, credit:'F', status:'已确认',
    profile:{domain:'（待积累画像）', freq:'—', stance:'—', indep:'—'}, fb:{valid:0, factual:0, last:'—'},
    creditNote:'人工登记（通道一 · decision-09）· 新准入 → 档 F'});

function pipeAdvance(id){
  const i = item(id); if (!i) return;
  if (i.status === '线索'){
    i.status = '候选情报';
    i.pipe[1].state = 'done'; i.pipe[1].time = '09-08 08:42'; i.pipe[1].note = '通过 → 候选情报';
    i.pipe[2].state = 'doing'; i.pipe[2].since = '09-08 08:42';
    i.trail.push({t:'候选情报（审查通过）', time:'2026-09-08 08:42'});
    toast('审查通过 → 候选情报');
  } else if (i.status === '候选情报'){
    i.status = '已核实';
    const p = i.verifyPreset || {rating:'B3', basis:'公式 v1：N=1，R=B → 内容可信度 3'};
    i.rating = p.rating; i.indepCount = 1; i.indep = i.indep.length ? i.indep : [i.provenanceSrc];
    i.ratingHistory.push({v:1, time:'2026-09-08 08:43', rating:p.rating, basis:p.basis, current:true});
    i.pipe && i.pipe.forEach(s => { if (s.state === 'doing'){ s.state = 'done'; s.time = '09-08 08:43'; } });
    i.trail.push({t:'已核实（' + p.rating + '）', time:'2026-09-08 08:43'});
    toast('核实评级完成 → 已核实 ' + p.rating);
  } else if (i.status === '已核实'){
    i.status = '已分发';
    if (!i.hits.length) i.hits = ['r1'];
    i.trail.push({t:'已分发（命中 ' + i.hits.join('、') + '）', time:'2026-09-08 08:44'});
    toast('已分发 · 见收件箱（晨间分发汇总为批量节奏，下一晨间送达推送）');
  }
  refresh();
}

function submitManual(){
  const medium = $('#sub-medium').value;
  const textEl = $('#sub-text');
  const text = textEl ? textEl.value.trim() : '';
  const carriers = UI.subCarriers.slice();
  if (!carriers.length && text) carriers.push('文字');
  if (!carriers.length){ toast('请选择载体素材，或填写文字纪要'); return; }
  const carrier = carriers.join(' + ');
  const rid = $('#sub-req').value;
  const stmt = text || '（人工录入 ' + carrier + ' · 陈述待采集智能体识别）';
  const id = 'i' + (DB.items.length + 1);
  DB.items.unshift({
    id, stmt, status:'线索', rating:null, indepCount:null, indep:[], provenanceSrc:null,
    provenance:[{src:null, role:'人工素材 · 溯源五要素待组装', time:'2026-09-08 08:45', carrier, chain:'A'}],
    ratingHistory:[], eventTime:'2026-09-08', collectTime:'2026-09-08 08:45', medium, carrier, mode:'人工提交',
    hits:rid?[rid]:[], citedBy:[], feedbacks:[],
    pipe:[{name:'线索 · 采集（按载体管线：' + (carriers.length > 1 ? carriers.join(' / ') + ' 并行，各自产出线索' : 'ASR / OCR / 解析') + '）', state:'done', time:'09-08 08:45'},
          {name:'审查 · 相关性 / 事件同一性 / 有效性初筛', state:'todo'},
          {name:'核实评级 · 穿透转引链 · 独立信源检索', state:'todo'}],
    trail:[{t:'线索（人工提交 · 不经定向任务化，直接进入审查）', time:'2026-09-08 08:45'}],
    attribution:'—'
  });
  toast('已提交 → 线索（同一流水线，进度见条目详情）');
  location.hash = '#/item/' + id;
}

function taskRegister(){
  const q = $('#task-question').value.trim();
  const h = $('#task-hypo').value.trim();
  if (!q){ toast('请填写问题陈述'); return; }
  const tid = 't' + (DB.tasks.length + 1);
  let cid = null;
  if (h){
    cid = 'c' + (DB.claims.length + 1);
    DB.claims.push({id:cid, stmt:h, status:'假设', confidence:null, registered:'2026-09-08', registrant:'消费方', byTask:tid,
      spawnedReqs:[], evidence:[],
      reasoning:[{time:'2026-09-08 08:50', judge:'消费方', action:'登记候选答案（初始态 = 假设，登记时转写）', basis:'decision-14', cites:[]}]});
  }
  DB.tasks.push({id:tid, question:q, status:'进行中', created:'2026-09-08', registrant:'消费方',
    attachment:$('#task-att').checked?{metrics:[], framework:'（示例附件占位）', guide:'（示例附件占位）'}:null,
    claims:cid?[cid]:[], scenarios:[], spawnedReqs:[]});
  toast('已登记探究任务' + (h?' + 转写首个候选答案':'（未转写——答案可作答即判定）'));
  location.hash = '#/task/' + tid;
}
function taskAddScenario(tid){
  const t = task(tid); if (!t) return;
  const s = $('#task-scenario').value.trim();
  if (!s){ toast('请填写场景草稿内容'); return; }
  (t.scenarios = t.scenarios || []).push(s);
  toast('已补记场景草稿（判定前不是答案）');
  refresh();
}
function taskClose(tid){
  const t = task(tid); if (!t) return;
  t.status = '已结题';
  const closed = [];
  (t.children||[]).forEach(cid => { const ct = task(cid); if (ct && ct.status === '进行中'){ ct.status = '已结题'; closed.push(cid.toUpperCase() + '·子任务'); } });
  t.spawnedReqs.forEach(rid => { const r = req(rid); if (r && r.status === '激活'){ r.status = '关闭'; closed.push(rid.toUpperCase()); } });
  toast('探究任务已结题 · 历史保留' + (closed.length?' · 关闭：' + closed.join('、'):'') + '（decision-13/15）');
  refresh();
}

function answerRegister(tid){
  const t = task(tid); if (!t) return;
  const stmt = $('#task-answer').value.trim();
  if (!stmt){ toast('请填写答案陈述'); return; }
  const cid = 'c' + (DB.claims.length + 1);
  const ev = (t.attachment ? t.attachment.metrics.filter(m => m.ev).map(m => m.ev) : [])
    .map(iid => ({item:iid, as:'判定证据（工作台聚合）'}));
  DB.claims.push({id:cid, stmt, status:'结论', confidence:'高', registered:'2026-09-08', registrant:'消费方', byTask:tid,
    spawnedReqs:[], evidence:ev,
    reasoning:[{time:'2026-09-08 08:52', judge:'消费方（构造性测算 v1 · 判定者记人）',
      action:'作答（登记即判定）→ 结论', basis:'置信度由公式从账本变量计算（decision-12/14）', cites:ev.map(e => e.item)}]});
  t.claims.push(cid);
  toast('已作答 · 结论（登记即判定）· 置信度由公式计算 · 结论可被引用（间接消费）');
  refresh();
}
function claimJudge(id){
  const c = claim(id); if (!c) return;
  const el = $('#judge-val-' + id);
  const val = (el && el.value.trim()) || '（构造性测算结果）';
  c.status = '结论';
  c.confidence = '高';
  c.reasoning.push({time:'2026-09-08 08:47', judge:'消费方（构造性测算 v1 · 判定者记人 · decision-12）',
    action:'判定：证实 → 结论（' + val + '）', basis:'公式 v1：M=2，W=2 → 置信度 高', cites:c.evidence.map(e => e.item)});
  toast('已转结论 · 置信度 高（公式从账本变量计算）· 结论可被引用（间接消费）');
  refresh();
}
function claimFbError(id){
  const c = claim(id); if (!c) return;
  c.status = '重估中';
  c.reasoning.push({time:'2026-09-08 08:48', judge:'记账层（反馈路由）', action:'事实错误反馈 → 进入重估中', basis:'结论反馈仅作用于结论态答案（探究任务工作台入口）；理由必填（示例：测算参数引用失效）', cites:[]});
  toast('结论 → 重估中（对结论态答案提事实错误触发重估）');
  refresh();
}

function reqAction(id, to){
  const r = req(id); if (!r) return;
  r.status = to;
  toast('情报需求 → ' + to);
  refresh();
}
function reqSpecSave(id){
  const r = req(id); if (!r) return;
  r.spec.topics = $('#spec-topics').value;
  r.spec.keywords = $('#spec-keywords').value;
  r.spec.pref = $('#spec-pref').value;
  r.spec.timing = $('#spec-timing').value;
  toast('内容规格已更新 · 微调生效于下轮采集');
  refresh();
}
function reqCreate(){
  const name = $('#req-name').value.trim();
  if (!name){ toast('请填写需求名称'); return; }
  const id = 'r' + (DB.reqs.length + 1);
  DB.reqs.push({id, name, type:$('#req-type').value, status:'草稿', window:'长期',
    spec:{topics:$('#req-topics').value, keywords:'', pref:'', timing:'晨间分发汇总（批量）'}});
  toast('已创建 · 初始态 = 草稿');
  location.hash = '#/requirement/' + id;
}

/* ================= 启动 ================= */
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
