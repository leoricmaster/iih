const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src = id => DB.sources.find(x => x.id === id);
const item = id => DB.items.find(x => x.id === id);
const claim = id => DB.claims.find(x => x.id === id);
const req = id => DB.reqs.find(x => x.id === id);
const srcName = id => { const s = src(id); return s ? s.name : '—'; };
const srcLink = id => { const s = src(id); return s ? `<a href="#/source/${id}">${esc(s.name)}</a>${s.credit ? ` <span class="pill">信用 ${s.credit}</span>` : ''}` : '—'; };
const itemLink = id => { const i = item(id); return i ? `<a href="#/item/${id}">${esc(i.stmt)}</a>` : '—'; };
const task = id => DB.tasks.find(x => x.id === id);
const taskLink = id => { const t = task(id); return t ? `<a href="#/task/${id}">${esc(t.question)}</a>` : '—'; };
const parentLink = id => task(id) ? `由研究课题 ${taskLink(id)} 催生（盯输入）` : (claim(id) ? `由命题 ${claimLink(id)} 催生（盯证据）` : '—');
const taskParentLink = id => `父课题：${taskLink(id)}`;
const claimLink = id => { const c = claim(id); return c ? `<a href="#/claim/${id}" title="${esc(c.stmt)}">${esc(c.stmt)}</a>` : '—'; };
const citeLink = id => item(id) ? itemLink(id) : (claim(id) ? claimLink(id) : '—');
const reqLink = id => { const r = req(id); return r ? `<a href="#/requirement/${id}">${esc(r.name)}</a>` : '—'; };
const ratingPill = r => r ? `<span class="pill rating">${esc(r)}</span>` : '<span class="pill dashed">未评级</span>';
const statusPill = s => `<span class="pill${s==='作废'?' dashed':''}">${esc(s)}</span>`;
const fbTypePill = t => `<span class="pill">${esc(t)}</span>`;
const feedbackPendingCount = () =>
  DB.items.filter(i => i.status === '已核实' && !i.retracted && !i.feedbacks.length).length;
const sourcesPendingCount = () =>
  DB.sources.filter(s => s.status === '待确认').length;
const alertsUnreadCount = () =>
  DB.alerts.filter(a => !a.read).length;
const isFeedbackPending = i => i.status === '已核实' && !i.retracted && !i.feedbacks.length;

function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}
function refresh(){ render(); renderIm(); }

/* ================= 路由 ================= */
const NAV_MAP = {items:'items', item:'items', alerts:'alerts', tasks:'tasks', task:'tasks',
                 claims:'claims', claim:'claims', graph:'graph',
                 reqs:'reqs', requirement:'reqs', sources:'sources', source:'sources', submit:null};
let PENDING_FB = null;   // 待补理由的事实错误反馈（跳详情）
let PENDING_REQ = null;  // 图谱孤岛预填的新情报需求（原型）
let UI = {itemFeedback:'待反馈', itemStatus:'全部', itemDisp:'全部', itemMode:'全部', itemQ:'',
          subFiles:[], subText:'', detail:{}, graphView:'实体视图', graphSel:null, onboard:false, probeReq:null};

function route(){
  const h = location.hash.replace(/^#\/?/, '') || 'items';
  const [page, id] = h.split('/');
  return {page, id};
}
const NAV_GROUPS = [
  ['消费', [['items','情报条目'], ['alerts','警报']]],
  ['探究', [['tasks','研究课题'],['claims','命题'],['graph','图谱']]],
  ['管理', [['reqs','情报需求'],['sources','信源库']]],
];
function renderNav(active){
  $('#nav').innerHTML = NAV_GROUPS.map(([g, links]) => `<div><div class="grp">${g}</div>` +
    links.map(([p, label]) => {
      const cnt = p === 'items' ? feedbackPendingCount() : p === 'sources' ? sourcesPendingCount() : p === 'alerts' ? alertsUnreadCount() : 0;
      return `<a href="#/${p}" class="${active===p?'active':''}">${label}${cnt?`<span class="cnt">${cnt}</span>`:''}</a>`;
    }).join('') + '</div>').join('');
}
const PAGES = {
  items: renderItems, item: renderItemDetail, alerts: renderAlerts,
  tasks: renderTasks, task: renderTaskDetail,
  claims: renderClaims, claim: renderClaimDetail, graph: renderGraph,
  reqs: renderReqs, requirement: renderReqDetail,
  sources: renderSources, source: renderSourceDetail, submit: renderSubmit,
};
function render(){
  const {page, id} = route();
  if (!(page === 'item' && id === PENDING_FB)) PENDING_FB = null;   // 事实错误跳详情：仅目标页保留预选
  renderNav(NAV_MAP[page]);
  const fn = PAGES[page] || PAGES.items;
  $('#app').innerHTML = onboardOverlay() + (id ? fn(id) : fn());
  if (PENDING_FB){ const el = $('#fb-reason-' + PENDING_FB); if (el) el.focus(); }
  window.scrollTo(0, 0);
}
function openPanel(id){ const el = document.getElementById(id); if (el) el.setAttribute('data-open',''); }
function closePanel(id){ const el = document.getElementById(id); if (el) el.removeAttribute('data-open'); }

/* ================= 情报条目 ================= */
const ITEM_FILTER_FEEDBACK = ['全部','待反馈','已反馈'];
const ITEM_FILTER_STATUS = ['全部','已核实','存疑','噪音','否决','线索','候选'];
const ITEM_FILTER_DISP = ['全部','未作废','已作废'];
const ITEM_FILTER_MODE = ['全部','自动拉取','人工提交'];

function renderItems(){
  const q = (UI.itemQ || '').trim().toLowerCase();
  const rows = DB.items.filter(i => {
    const okFb = UI.itemFeedback === '全部' ? true
      : UI.itemFeedback === '待反馈' ? isFeedbackPending(i)
      : i.feedbacks.length > 0;
    const okSt = UI.itemStatus === '全部' || i.status === UI.itemStatus;
    const okDisp = UI.itemDisp === '全部' ? true
      : UI.itemDisp === '未作废' ? !i.retracted : !!i.retracted;
    const okMode = UI.itemMode === '全部' || i.mode === UI.itemMode;
    const hay = [i.stmt, srcName(i.provenanceSrc), ...itemEntities(i.id).map(e => e.name)].join(' ').toLowerCase();
    const okQ = !q || hay.includes(q);
    return okFb && okSt && okDisp && okMode && okQ;
  }).sort((a,b) => (b.eventTime||'').localeCompare(a.eventTime||''));
  return `
  <h1 class="page">情报条目</h1>
  <div class="sub">默认待反馈 = 已核实 ∧ 未作废 ∧ 无反馈（消费优先 · doc-07 §3）；对象一页制——本页 + 条目详情。</div>
  <div class="box">
    <div class="field" style="margin:0 0 10px"><input type="text" id="item-q" placeholder="检索：陈述 / 信源 / 实体提及（doc-07 §3）" value="${esc(UI.itemQ)}" oninput="setItemQ(this.value)"></div>
    <div class="chips"><span class="lbl">反馈</span>${ITEM_FILTER_FEEDBACK.map(f =>
      `<span class="chip ${UI.itemFeedback===f?'on':''}" onclick="setItemFeedback('${f}')">${f}</span>`).join('')}</div>
    <div class="chips"><span class="lbl">状态</span>${ITEM_FILTER_STATUS.map(s =>
      `<span class="chip ${UI.itemStatus===s?'on':''}" onclick="setItemFilter('${s}')">${s}</span>`).join('')}</div>
    <div class="chips"><span class="lbl">处置</span>${ITEM_FILTER_DISP.map(d =>
      `<span class="chip ${UI.itemDisp===d?'on':''}" onclick="setItemDisp('${d}')">${d}</span>`).join('')}</div>
    <div class="chips"><span class="lbl">采集模式</span>${ITEM_FILTER_MODE.map(m =>
      `<span class="chip ${UI.itemMode===m?'on':''}" onclick="setItemMode('${m}')">${m}</span>`).join('')}</div>
    <table>
      <tr><th>陈述</th><th>评级</th><th>独立信源</th><th>状态</th><th>处置</th><th>出处信源</th><th>媒介</th><th>采集模式</th><th>事件时间</th><th></th></tr>
      ${rows.length ? rows.map(i => `
        <tr>
          <td><a href="#/item/${i.id}">${esc(i.stmt)}</a>${i.mode==='人工提交'?' <span class="pill">人工提交</span>':''}</td>
          <td>${ratingPill(i.rating)}</td>
          <td>${i.indepCount!=null?`×${i.indepCount}`:'—'}</td>
          <td>${statusPill(i.status)}</td>
          <td>${i.retracted?'<span class="pill dashed">作废</span>':'<span class="muted">—</span>'}</td>
          <td>${srcLink(i.provenanceSrc)}</td>
          <td class="muted">${esc(i.medium)}</td>
          <td class="muted">${esc(i.mode)}</td>
          <td class="muted">${esc(i.eventTime)}</td>
          <td>${isFeedbackPending(i)?`<span class="rowfb">
            <button class="chip" onclick="fbQuick('${i.id}','有效')" title="快捷反馈（默认理由）">有效</button>
            <button class="chip" onclick="fbQuick('${i.id}','重复 / 噪音')" title="快捷反馈（默认理由）">重复 / 噪音</button>
          </span>`:''}</td>
        </tr>`).join('') : `<tr><td colspan="10"><div class="empty">当前筛选下无条目</div></td></tr>`}
    </table>
    <div class="muted" style="margin-top:6px">待反馈行 hover 出现行内快捷反馈（默认理由 · 提交即出队）；其余类型走条目详情单表单（doc-07 §5）。</div>
  </div>`;
}
function setItemFeedback(f){ UI.itemFeedback = f; render(); }
function setItemFilter(s){ UI.itemStatus = s; render(); }
function setItemDisp(d){ UI.itemDisp = d; render(); }
function setItemMode(m){ UI.itemMode = m; render(); }
function setItemQ(v){
  UI.itemQ = v; render();
  const el = $('#item-q');
  if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function fbQuickRow(id){
  const i = item(id);
  if (i.feedbacks.length)
    return `<span class="done-note">✓ 已反馈 · ${esc(i.feedbacks[i.feedbacks.length-1].type)}（${esc(i.feedbacks[i.feedbacks.length-1].reason)}）</span>`;
  return FB_TYPES.map(t =>
    t === '事实错误'
      ? `<a class="btn small" href="#/item/${id}" onclick="fbJump('${id}')">事实错误 ↗详情</a>`
      : `<button class="btn small" onclick="fbQuick('${id}','${t}')">${t}</button>`
  ).join('') + `<a class="btn small" href="#/item/${id}">详情</a>`;
}
function fbJump(id){ PENDING_FB = id; render(); }

function itemNeighbors(id){
  const order = [...DB.items].sort((a,b) => (b.eventTime||'').localeCompare(a.eventTime||''));
  const idx = order.findIndex(i => i.id === id);
  return {prev: idx>0 ? order[idx-1] : null, next: idx>=0 && idx<order.length-1 ? order[idx+1] : null};
}
function toggleDetail(key){ UI.detail = UI.detail || {}; UI.detail[key] = !UI.detail[key]; render(); }
function collapseBox(key, title, summary, content, tag){
  const open = !!(UI.detail && UI.detail[key]);
  return `<div class="box"><h2 style="cursor:pointer;user-select:none" onclick="toggleDetail('${key}')">${open?'▾':'▸'} ${title}${summary?` <span class="muted" style="font-weight:400;font-size:12.5px">${summary}</span>`:''}${tag?` <span class="sketch-tag">${tag}</span>`:''}</h2>${open?content:''}</div>`;
}
function ratingDims(r){ return r ? [r[0], r.slice(1)] : [null,null]; }
function snapshotCell(i){
  if (i.snapshot === 'transcript'){
    const m = DB.materials.find(x => x.id === i.material);
    return m ? `<details class="markdetails"><summary>转写稿（${esc(m.filename)}）</summary><pre class="transcript">${esc(m.transcript)}</pre></details>` : '—';
  }
  if (i.mode === '人工提交'){
    const txt = i.originalText || i.stmt;
    return `<details class="markdetails"><summary>提交文本</summary><pre class="transcript">${esc(txt)}</pre></details>`;
  }
  return `<span class="stub" title="自动条目为存档链接（对象存储回放，CSP sandbox · doc-07 §3）；原型不承载">存档页 ↗</span>`;
}

function renderItemDetail(id){
  const i = item(id); if (!i) return '<div class="empty">条目不存在</div>';
  const chainGroups = {};
  i.provenance.forEach(p => { (chainGroups[p.chain] = chainGroups[p.chain] || []).push(p); });
  const ents = itemEntities(id);
  const {prev, next} = itemNeighbors(id);
  const [grade, cred] = ratingDims(i.rating);
  const cur = i.ratingHistory.find(r => r.current) || i.ratingHistory[i.ratingHistory.length-1];
  const chainCount = Object.keys(chainGroups).length;

  // L0 · sticky 上下文条（陈述 + 评级 + 状态 + 处置 + 上下条目）
  const sticky = `<div class="detail-sticky">
    ${prev?`<a class="btn small" href="#/item/${prev.id}" title="${esc(prev.stmt)}">‹</a>`:'<span class="btn small" style="opacity:.4;cursor:default">‹</span>'}
    ${next?`<a class="btn small" href="#/item/${next.id}" title="${esc(next.stmt)}">›</a>`:'<span class="btn small" style="opacity:.4;cursor:default">›</span>'}
    <span class="stmt">${esc(i.stmt)}</span>
    ${ratingPill(i.rating)} ${statusPill(i.status)} ${i.retracted?'<span class="pill dashed">作废</span>':''} ${i.indepCount!=null?`<span class="pill">独立 ×${i.indepCount}</span>`:''}
  </div>`;

  // L1 · hero（摘要优先）
  const hero = `<div class="box">
    <h2>${esc(i.stmt)}</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 8px">
      ${statusPill(i.status)} ${i.retracted?'<span class="pill dashed">作废</span>':''} ${ratingPill(i.rating)}${grade?`<span class="muted">信源${esc(grade)} · 可信度${esc(cred)}</span>`:''} ${i.indepCount!=null?`<span class="pill">独立信源 ×${i.indepCount}</span>`:''}
    </div>
    <div class="muted">出处 ${srcLink(i.provenanceSrc)} · 事件时间 ${esc(i.eventTime)} · 采集 ${esc(i.collectTime)} · ${esc(i.medium)} / ${esc(i.carrier)} · ${esc(i.mode)}</div>
    <h3 style="margin-top:10px">状态迁移</h3>
    <div class="muted">${i.trail.map(t => `${esc(t.t)}<span class="muted">（${esc(t.time)}）</span>`).join(' <span class="arrow">→</span> ')}</div>
  </div>`;

  // L1 · 状态自适应主区
  let mainRegion = '';
  if (['线索','候选'].includes(i.status) && i.pipe){
    mainRegion = `<div class="box"><h2>流水线进度（线索 → 审查 → 核实评级）</h2>
      <ul class="pipe">${i.pipe.map(p => `
        <li><span class="st ${p.state}">${p.state==='done'?'✓':p.state==='doing'?'●':'○'}</span>
        <span>${esc(p.name)} ${p.time?`<span class="muted">${esc(p.time)}</span>`:''}${p.since?`<span class="muted">自 ${esc(p.since)}</span>`:''}${p.note?`<br><span class="muted">${esc(p.note)}</span>`:''}</span></li>`).join('')}
      </ul>
      <div class="fbrow"><button class="btn small primary" onclick="pipeAdvance('${i.id}')">▶ 模拟推进（原型专用）</button></div>
      <div class="muted" style="margin-top:6px">人工提交不经定向任务化，直接进入审查（doc-06 §3）；核实完成后入待反馈（情报条目默认视图）。</div>
    </div>`;
  } else if (i.status === '已核实'){
    mainRegion = `<div class="box"><h2>评级依据</h2>
      <div>${cur?esc(cur.basis):'<span class="muted">—</span>'}</div>
      <div class="muted" style="margin-top:6px">重评触发器：新印证合并｜信源信用分档迁移｜人工触发｜评级异议（doc-02 §5.1）；下游引用取当前值。</div>
    </div>`;
  } else if (i.status === '存疑'){
    const last = i.trail[i.trail.length-1];
    const os = i.provenanceSrc ? src(i.provenanceSrc) : null;
    mainRegion = `<div class="box"><h2>存疑说明</h2>
      <div class="muted">${last?esc(last.t):'核实无法完成，挂起待复核'}</div>
      <div class="fbrow" style="margin-top:8px"><button class="btn small primary" onclick="itemReverify('${i.id}')">重新核实</button></div>
      ${os && os.status === '待确认' ? `<div class="muted" style="margin-top:6px">出处信源 ${srcLink(os.id)} 尚待确认——<a href="#/source/${os.id}">去确认 ↗</a></div>` : ''}
      ${os && !os.credit ? `<div class="muted" style="margin-top:6px">出处信源 ${srcLink(os.id)} 未设信用档——先到画像页人工设档，再回此处重核。</div>` : ''}
      <div class="muted" style="margin-top:6px">复核兜底期内若有新证据命中事件级合并键，回流候选重新核实（doc-05 §4）。</div>
    </div>`;
  } else if (['噪音','否决'].includes(i.status)){
    mainRegion = `<div class="box"><h2>${i.status === '噪音' ? '审查否决' : '核实否决'}</h2>
      <div>${i.review?esc(i.review.rationale):'审查否决'}</div>
      <div class="muted" style="margin-top:6px">否决理由：${i.review?esc(i.review.reason):'—'}（${esc(i.status)} = 终态 · doc-02 §4.2）</div>
    </div>`;
  }

  // L1 · 作废原因（处置标记位 · 独立区）
  const retractedBox = i.retracted ? (() => {
    const fe = i.feedbacks.find(f => f.type === '事实错误');
    return `<div class="box"><h2>作废原因</h2>
      <div>${fe?esc(fe.reason):'已作废'}</div>
      <div class="muted" style="margin-top:6px">作废为处置标记位（保留已核实态 · doc-02 §4.2）：停发并级联重估引用它的命题；已扣减责任信源（最早引入方）信用。</div>
    </div>`;
  })() : '';

  // L1 · 反馈（主操作常驻 · 单表单）
  const feedback = (i.status === '已核实' && !i.retracted) ? `
  <div class="box"><h2>反馈</h2>
    <div class="fbtypes">${FB_TYPES.map(t => `<label><input type="radio" name="fbtype-${i.id}" value="${t}"${(PENDING_FB===i.id ? t==='事实错误' : t==='有效')?' checked':''}> ${t}</label>`).join('')}</div>
    <div class="field" style="margin-top:8px"><label>理由（可选 · 空则记「快捷 · {类型}」；事实错误必填 · doc-07 §5）</label>
      <textarea id="fb-reason-${i.id}" placeholder="${PENDING_FB===i.id?'必填：请说明事实错误的依据':'补写理由（可选）'}"></textarea></div>
    <div class="err" id="fb-err-${i.id}" hidden>事实错误理由必填。</div>
    <button class="btn primary" onclick="fbSubmit('${i.id}')">提交反馈</button>
  </div>` : (i.status === '噪音' && !i.retracted) ? `
  <div class="box"><h2>反馈 · 审查异议</h2>
    <div class="field"><label>审查异议（理由必填，将作为重审输入 · doc-02 §6）</label>
      <textarea id="rv-dispute-${i.id}" placeholder="必填：说明为何不认同否决"></textarea></div>
    <div class="err" id="rv-err-${i.id}" hidden>审查异议理由必填。</div>
    <button class="btn primary" onclick="reviewDispute('${i.id}')">提交异议并重审</button>
  </div>` : `
  <div class="box"><h2>反馈</h2><div class="muted">当前状态（${esc(i.status)}${i.retracted?' ∧ 已作废':''}）不开放反馈——反馈挂载于已核实未作废的消费现场（doc-07 §5）。</div></div>`;

  // L2 · 元数据（默认折叠 · 完整记录）
  const metaContent = `<dl class="kv">
      <dt>状态</dt><dd>${statusPill(i.status)}</dd>
      <dt>处置</dt><dd>${i.retracted ? '作废（事实错误）' : '—'}</dd>
      <dt>事件时间</dt><dd>${esc(i.eventTime)}</dd>
      <dt>采集时间</dt><dd>${esc(i.collectTime)}</dd>
      <dt>媒介 / 载体</dt><dd>${esc(i.medium)} / ${esc(i.carrier)}</dd>
      <dt>采集模式</dt><dd>${esc(i.mode)}</dd>
      <dt>出处信源</dt><dd>${srcLink(i.provenanceSrc)}</dd>
      <dt>途径</dt><dd>${esc(i.outlet || '—')}</dd>
      <dt>原文快照</dt><dd>${snapshotCell(i)}</dd>
      <dt>原文链接</dt><dd>${i.mode === '自动拉取' ? '<span class="stub" title="原型不承载原文链接">原文链接 ↗</span>' : '—'}</dd>
      <dt>登记时间</dt><dd>${esc(i.registered || i.collectTime)}</dd>
      <dt>命中情报需求</dt><dd>${i.hits.map(reqLink).join('、') || '—'}</dd>
      <dt>实体提及</dt><dd>${ents.map(e => `<a href="#/graph" onclick="selectEnt('${e.id}')">${esc(e.name)}</a>`).join('、') || '—'}</dd>
      <dt>被引用</dt><dd>${i.citedBy.map(c => `${claimLink(c.claim)}<span class="muted">（${esc(c.as)}）</span>`).join('；') || '—'}</dd>
    </dl>`;
  const meta = collapseBox('meta', '元数据', '完整 14 项', metaContent);

  // L2 · 独立信源计数（默认折叠）
  const indep = collapseBox('indep', '独立信源计数', i.indepCount!=null?`×${i.indepCount}`:'—',
    `<div>穿透转引链后：<b>${i.indepCount!=null?`×${i.indepCount}`:'—'}</b>${i.indep.length?`（${i.indep.map(srcLink).join('、')}）`:''}</div>
     <div class="muted" style="margin-top:4px">N 家转载同一通稿 = 1 个独立信源；同主体多途径（如官网 + 公众号）= 1——按发布主体计数（doc-03 §六）。</div>`);

  // L2 · 关联图（默认折叠）
  const graph = ents.length ? collapseBox('graph', '关联图', `${ents.length} 实体`, mentionGraphSVGInner('item', id), '草图') : '';

  // L3 · 转引链穿透（核查动线 · 默认折叠）
  const chain = collapseBox('chain', '转引链穿透视图', `${chainCount} 链 ${i.provenance.length} 节点`,
    `${Object.entries(chainGroups).map(([c, nodes]) => `
      <div style="margin-bottom:8px"><span class="muted">链 ${esc(c)}</span>
      <ul class="chain">${nodes.map((p, n) => `
        <li class="${n===0?'first':''}">
          ${srcLink(p.src)}<span class="muted"> · ${esc(p.outlet || '途径未记')}</span> <span class="pill">${esc(p.role)}</span>
          <span class="muted">${esc(p.time)} · 载体 ${esc(p.carrier)}${p.src===i.provenanceSrc?' · <b>信用归因对象（最早引入方 · decision-04）</b>':''}</span>
          <span class="stub" title="原文快照仅内部留存用于溯源（立项 §8），分发携带链接而非快照本体">原文快照</span>
        </li>`).join('')}</ul></div>`).join('')}
     <div class="muted">转引链 = 载体 → … → 原始信源；节点记信源 × 途径 × 载体 × 时间（doc-03 §六）——核实与独立性判断的依据（术语表）。</div>`,
    '草图');

  // L3 · 评级历史（核查动线 · 默认折叠）
  const rh = i.ratingHistory.length ? collapseBox('rh', '评级历史（版本化 · 可重放）', `${cur&&cur.v?`v${cur.v}`:'—'}${cur&&cur.current?' · 当前':''}`,
    `<table>
      <tr><th>时间</th><th>结果</th><th>N</th><th>R</th><th>可信度</th><th>评级</th><th>公式版本</th><th>依据</th></tr>
      ${i.ratingHistory.map(r => `<tr><td class="muted">${esc(r.time)}</td>
        <td>${r.n!=null?'已核实':'—'}</td>
        <td>${r.n!=null?r.n:'—'}</td>
        <td>${r.r||'—'}</td>
        <td>${r.cred||'—'}</td>
        <td>${ratingPill(r.rating)}</td>
        <td class="muted">${esc(r.formula||'—')}</td>
        <td class="muted">${esc(r.basis)}${r.current?' <b>（当前）</b>':''}</td></tr>`).join('')}
    </table>`,
    '草图') : '';

  // L3 · 反馈记录（默认折叠）
  const fbrec = collapseBox('fbrec', '反馈记录', `${i.feedbacks.length} 条`,
    i.feedbacks.length ? i.feedbacks.map(f => `
      <div style="border-bottom:1px solid #eee;padding:8px 0">
        ${fbTypePill(f.type)} <span class="muted">${esc(f.time)}</span>
        <div style="margin:3px 0">理由：${esc(f.reason)}</div>
        <div class="muted">路由：${esc(f.routing)}</div>
      </div>`).join('') : '<div class="empty">暂无反馈</div>');

  return `
  <h1 class="page"><a href="#/items">情报条目</a> / 详情</h1>
  <div class="sub">消费动线与核查动线的交汇点：摘要优先，核查深区按需展开（doc-07 §3）。</div>
  ${sticky}
  ${hero}
  ${mainRegion}
  ${retractedBox}
  ${feedback}
  ${meta}
  ${indep}
  ${graph}
  ${chain}
  ${rh}
  ${fbrec}`;
}

  <div class="box">
    ${groups.map(g => {
      const list = DB.tasks.filter(t => t.status === g && !t.parent);
      if (!list.length) return '';
      return `<h3 style="margin:10px 0 4px">${g} <span class="muted">× ${list.length}</span></h3>
      <table>
        <tr><th>问题</th><th>答案命题</th><th>催生需求</th><th>创建</th><th>登记方</th></tr>

          <td class="muted">${t.spawnedReqs.length?t.spawnedReqs.map(reqLink).join('、'):'—'}</td>
          <td class="muted">${esc(t.created)}</td>
          <td class="muted">${esc(t.registrant)}</td></tr>`).join('')}
      </table>`;
    }).join('') || '<div class="empty">暂无研究课题</div>'}
  </div>
  <div class="box"><h2>登记研究课题</h2>
    <div class="field"><label>问题陈述（问句——答案命题是可判真假的陈述，在工作台落成）</label>
      <textarea id="task-question" placeholder="例：某细分市场空间有多大？"></textarea></div>
    <div class="field"><label>提示词（可选 · 自由文本：指标清单 / 测算框架 / 信源指引；留空则智能体自行发挥 · decision-06）</label>
      <input type="text" id="task-prompt" placeholder="例：单元存量法 / 工作量产能法两种测算法，矿卡保有量取大型露天矿"></div>
    <button class="btn primary" onclick="taskRegister()">登记</button>
    <div class="muted" style="margin-top:8px">已有候选答案或几种可能结局？登记后在工作台补记（候选答案 = 假设命题，由证据持续检验）。答案落成命题，可被引用、可翻案；命题独立于研究课题存续（decision-06）。</div>
  </div>`;
}

function renderTaskDetail(id){

  return `
  <h1 class="page"><a href="#/tasks">研究课题</a> / 工作台</h1>
  <div class="sub">研究课题探究期间的工作台停留点（doc-07 §1 项目式节奏）：课题树、命中条目聚合、提示词、催生需求一屏可见。判定与推理记录归命题（decision-06）。</div>

  <div class="box">
    <h2>${esc(t.question)} &nbsp;${statusPill(t.status)}</h2>
    <div class="muted">创建 ${esc(t.created)} · 登记方 ${esc(t.registrant)} · 只管问题生命周期（进行中 → 已结题）；结题后命题仍存续、可翻案（decision-06）。</div>
    ${t.status==='进行中'?`<div class="fbrow" style="margin-top:8px"><button class="btn small" onclick="taskClose('${t.id}')">结题（问题已回答或放弃 · 关催生子需求与子课题，历史保留）</button></div>`:''}

    <div class="muted" style="margin-bottom:8px">登记后尚无子课题——演示定向智能体按提示词递归分解一层的产物（decision-06）：子课题 ×2 + 盯输入需求 ×2（示例命名）。</div>
    <button class="btn small primary" onclick="taskSimDecompose('${t.id}')">▶ 模拟定向分解（原型专用）</button>

  <div class="box"><h2>课题树（问题树 · decision-06）</h2>

    ${t.children && t.children.length ? `
      <h3>子课题（按测算法分解）</h3>
      <table>
        <tr><th>子课题</th><th>子结论命题</th><th>状态</th><th>置信度</th></tr>
        ${t.children.map(cid => { const ct = task(cid); const cc = ct.claims.map(claim)[0] || null; return `
          <tr><td><a href="#/task/${cid}">${esc(ct.question)}</a></td>
          <td>${cc?`<a href="#/claim/${cc.id}">${esc(cc.stmt)}</a>`:'—'}</td>
          <td>${cc?statusPill(cc.status):'—'}</td>
          <td>${cc&&cc.confidence?esc(cc.confidence):'—'}</td></tr>`; }).join('')}
      </table>
      <div class="muted" style="margin-top:6px">父课题取子命题按框架合成答案命题（非叶子 · 逻辑合成 · decision-06）；子命题变 → 父命题级联重估。</div>` : ''}
  </div>` : ''}

  <div class="box"><h2>答案命题（命题 · 可选）</h2>
    ${claims.length ? `<table>
      <tr><th>陈述</th><th>状态</th><th>置信度</th></tr>
      ${claims.map(c => `
        <tr><td><a href="#/claim/${c.id}">${esc(c.stmt)}</a></td>
        <td>${statusPill(c.status)}</td>
        <td>${c.confidence?esc(c.confidence):'—'}</td></tr>`).join('')}
    </table>
    <div class="muted" style="margin-top:6px">判定、置信度、推理记录、结论反馈以命题为单位——详见<a href="#/claims">命题页</a>（decision-06）。</div>` : '<div class="muted">未设候选答案——估算类可不预转写，最终答案作答（登记即判定）落成结论命题。</div>'}

    <h3 style="margin-top:14px">候选答案（可选 · 登记为假设命题）</h3>
    <div class="field"><label>心里已有答案就写成一句可判真假的陈述——登记为假设命题，由证据持续检验（防「假设无人求证，自然遗忘」）；估算类不预写，最后直接作答</label>
      <input type="text" id="task-hypo" placeholder="例：该市场空间在 A–B 亿元区间"></div>

      <input type="text" id="task-scenario" placeholder="例：若补贴政策落地，市场空间在 C–D 亿元区间（另一情形）"></div>

  ${t.prompt ? `
  <div class="box"><h2>提示词（伴随输入 · 自由文本，可空 · decision-06）</h2>
    ${typeof t.prompt === 'string' ? `<div class="muted">${esc(t.prompt)}</div>` : `

  <div class="box"><h2>催生的情报需求（盯输入）</h2>
    <div>${t.spawnedReqs.map(reqLink).join('、') || '—'}</div>
    <div class="muted" style="margin-top:4px">系统无人值守；生效窗口至本课题结题（decision-06）。</div>
  </div>

  ${hitItems.length ? `
  <div class="box"><h2>命中条目（按指标聚合）</h2>
    ${hitItems.map(iid => { const i = item(iid); return `
      <div style="border-bottom:1px solid #eee;padding:7px 0">
        <a href="#/item/${iid}">${esc(i.stmt)}</a> ${statusPill(i.status)} ${ratingPill(i.rating)}
      </div>`; }).join('')}
  </div>` : ''}`;
}

/* ================= 命题 ================= */
function renderClaims(){
  const groups = ['假设','结论','重估中','已证伪','存疑'];
  return `
  <h1 class="page">命题</h1>
  <div class="sub">可判真假的陈述——求证/核实线的原子单位，独立状态机（decision-06）。按状态分组；结论一览由此筛。命题独立于研究课题存续，结题后仍可被引用与翻案。</div>
  <div class="box">
    ${groups.map(g => {
      const list = DB.claims.filter(c => c.status === g);
      if (!list.length) return '';
      return `<h3 style="margin:10px 0 4px">${g} <span class="muted">× ${list.length}</span></h3>
      <table>
        <tr><th>陈述</th><th>状态</th><th>置信度</th><th>归属</th><th>证据</th></tr>
        ${list.map(c => `
          <tr><td><a href="#/claim/${c.id}">${esc(c.stmt)}</a></td>
          <td>${statusPill(c.status)}</td>
          <td>${c.confidence?esc(c.confidence):'—'}</td>
          <td class="muted">${c.byTask?taskLink(c.byTask):'独立登记'}</td>
          <td class="muted">${c.evidence.length} 条</td></tr>`).join('')}
      </table>`;
    }).join('') || '<div class="empty">暂无命题</div>'}
  </div>
  <div class="box"><h2>登记断言（独立登记 · 世界递来的断言）</h2>
    <div class="field"><label>陈述（可判真假）</label>
      <input type="text" id="claim-stmt" placeholder="例：W 公司将与 Z 公司成立合资公司"></div>
    <button class="btn primary" onclick="claimRegister()">登记（初始态 = 假设）</button>
    <div class="muted" style="margin-top:8px">独立登记的断言不挂研究课题，直接进命题侧求证；也可被多个研究课题引用（decision-06）。</div>
  </div>`;
}

function renderClaimDetail(id){
  const c = claim(id); if (!c) return '<div class="empty">命题不存在</div>';
  const composite = c.evidence.length && c.evidence.every(e => e.subclaim);   // 合成命题：证据=子命题（判定方式二分 · decision-06）
  const judging = c.status === '假设' && !composite && c.evidence.some(e => e.item);
  return `
  <h1 class="page"><a href="#/claims">命题</a> / 详情</h1>
  <div class="sub">求证线的交汇点：陈述、状态、置信度、推理记录、引用证据、结论反馈，一屏尽出（doc-07 §3）。</div>

  <div class="box">
    <h2>${esc(c.stmt)} &nbsp;${statusPill(c.status)} ${c.confidence?`<span class="pill">置信度 ${esc(c.confidence)}</span>`:''}</h2>
    <div class="muted">登记 ${esc(c.registered)} · 登记方 ${esc(c.registrant)} · 归属 ${c.byTask?taskLink(c.byTask):'独立登记'}。判定、置信度、推理记录以单个命题为单位（decision-06）。</div>
  </div>

  <div class="box"><h2>引用证据</h2>
    ${c.evidence.length ? `<table><tr><th>证据</th><th>角色</th></tr>
      ${c.evidence.map(e => `<tr><td>${citeLink(e.item || e.subclaim)}</td><td class="muted">${esc(e.as)}</td></tr>`).join('')}
    </table>` : '<div class="muted">暂无证据——叶子命题从已核实情报条目判定，合成命题从子命题合成（判定方式二分 · decision-06）。</div>'}
  </div>

  ${mentionGraphSVG('claim', id)}

  ${c.diff && c.status === '重估中' ? `
  <div class="box"><h2>变化前后对比（重估中）</h2>
    <table class="diff">
      ${c.diff.map(d => `<tr><td>${esc(d.obj)}</td><td>${esc(d.before)}</td><td class="arrow">→</td><td><b>${esc(d.after)}</b></td></tr>`).join('')}
    </table>
    <div class="muted" style="margin-top:6px">${esc(c.alertNote||'')}</div>
    <div style="margin-top:6px">触发源条目：${itemLink('i4')} <span class="muted">（可反馈事实错误 / 评级异议）</span></div>
  </div>` : ''}

  ${c.reasoning.length ? `
  <div class="sketch"><h2 style="font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center">推理记录（每次判定落档） <span class="sketch-tag">草图 · 实现时按真实数据重画</span></h2>
    <table>
      <tr><th>时间</th><th>判定者</th><th>动作</th><th>依据（含公式版本）</th><th>引用</th></tr>
      ${c.reasoning.map(r => `
        <tr><td class="muted" style="white-space:nowrap">${esc(r.time)}</td><td>${esc(r.judge)}</td>
        <td>${esc(r.action)}</td><td class="muted">${esc(r.basis)}</td>
        <td>${r.cites.map(citeLink).join('、')||'—'}</td></tr>`).join('')}
    </table>

function materialRow(m){

        <div class="fbrow" style="margin-top:6px"><button class="btn small primary" onclick="saveTranscript('${m.id}')">保存</button></div>
      </details>
    </details>`;
  } else if (m.transcript){
    inner = `<details class="markdetails"><summary>转写稿</summary><pre class="transcript">${esc(m.transcript)}</pre></details>`;
    if (m.status === '已完成'){
      inner += `<details class="markdetails"><summary>编辑转写稿</summary>
        <textarea id="tr-${m.id}" rows="8">${esc(m.transcript)}</textarea>

    }
  }
  return `<div style="border-bottom:1px solid #eee;padding:8px 0">
    <span>${esc(m.filename)}</span>
    <span class="pill ${m.status === '待标记' ? 'dashed' : ''}">${esc(m.status)}</span>
    <span class="muted">${esc(m.medium)} · ${esc(m.collected)} · ${fmtDur(m.duration)}</span>
    ${m.item ? `<a class="btn small" href="#/item/${m.item}">→ 条目 ${m.item.toUpperCase()}</a>` : ''}
    ${inner}
  </div>`;
}

function applyFeedback(it, type, reason){
  const r = reason && reason.trim() ? reason.trim() : '快捷 · ' + type;
  it.feedbacks.push({type, reason:r, time:'2026-09-08 08:41',
    routing:ROUTING_NOTE[type] + (['有效','事实错误'].includes(type)&&it.attribution&&it.attribution!=='—'?` · 归因：${it.attribution}`:'')});
  if (type === '事实错误'){
    it.retracted = true;
    it.trail.push({t:'作废（事实错误）', time:'2026-09-08 08:41'});
    const cascaded = [];
    DB.claims.forEach(c => {
      if (['结论','已证伪'].includes(c.status) && c.evidence.some(e => e.item === it.id)){
        c.status = '重估中';
        c.reasoning.push({time:'2026-09-08 08:41', judge:'记账层（调度）', action:'级联重估触发：' + it.id + ' 作废 → 进入重估中', basis:'推理记录引用关系', cites:[it.id]});
        cascaded.push(c.id);
      }
    });
    toast('已作废（处置标记 · 保留已核实态）' + (cascaded.length?'，级联重估：'+cascaded.join('、'):'（无结论引用该条目）'));
  } else if (type === '评级异议'){
    it.ratingHistory.push({time:'2026-09-08 08:41', rating:it.rating, basis:'评级异议触发重评（doc-02 §5.1）· 重评中'});
    toast('已记录评级异议 · 已触发评级重评');
  } else {
    toast('已记录 ' + type + ' · ' + ROUTING_NOTE[type]);
  }
}
function fbQuick(id, type){
  const it = item(id); if (!it) return;
  if (type === '事实错误'){ PENDING_FB = id; location.hash = '#/item/' + id; render(); return; }
  applyFeedback(it, type, null);
  refresh();
}
function fbSubmit(id){
  const it = item(id); if (!it) return;
  const checked = document.querySelector(`input[name="fbtype-${id}"]:checked`);
  const type = checked ? checked.value : '有效';
  const reason = $('#fb-reason-' + id).value;
  if (type === '事实错误' && !reason.trim()){
    const err = $('#fb-err-' + id); err.hidden = false; return;
  }
  PENDING_FB = null;
  applyFeedback(it, type, reason);
  refresh();
}
function itemReverify(id){
  const i = item(id); if (!i) return;
  i.status = '候选';
  i.pipe = [

    window: end ? (start || '2026-09-10') + ' 至 ' + end : '常驻',
    validFrom: start || null, validUntil: end || null,
    freq: $('#req-freq').value.trim() || null,
    eventWindow: $('#req-event-window').value.trim() || null,
    explore: explore || null,
    sources: sourceIds.length ? sourceIds : null,
    contentSpec: $('#req-spec').value.trim(),
    lastCollected: null, recentHits: []});
  const fromOrphan = !!PENDING_REQ;
  PENDING_REQ = null;
  closePanel('req-register');
  toast('已创建 · 初始态 = 草稿' + (fromOrphan ? '（孤岛实体经后续条目提及并入邻域）' : ''));
  location.hash = '#/requirement/' + id;
}
function runPipeline(){
  const leads = DB.items.filter(i => i.status === '线索');
  const cands = DB.items.filter(i => i.status === '候选');
  leads.forEach(i => pipeAdvance(i.id));
  cands.forEach(i => pipeAdvance(i.id));
  if (!leads.length && !cands.length){ toast('流水线一轮完成：无待处理线索 / 候选'); return; }
  toast(`流水线一轮完成：候选 +${leads.length} · 已核实 +${cands.length}（入待反馈）`);
}
function probeReq(id){ UI.probeReq = id; render(); }

/* ================= 图谱（实体底座 · doc-02 §3） ================= */
const EPOS = {e1:[430,205],e2:[665,125],e3:[665,290],e4:[875,60],e5:[875,215],e6:[160,360]};
const G_ENT_W = 126, G_ENT_H = 46;

const entOf = id => DB.entities.find(e => e.id === id);
const itemEntities = iid => DB.entities.filter(e => e.mentions.items.includes(iid));
const claimEntities = cid => DB.entities.filter(e => e.mentions.claims.includes(cid));
function entEdges(){
  const out = [];
  for (let a = 0; a < DB.entities.length; a++) for (let b = a + 1; b < DB.entities.length; b++){
    const A = DB.entities[a], B = DB.entities[b];
    const co = [...A.mentions.items.filter(x => B.mentions.items.includes(x)),
                ...A.mentions.claims.filter(x => B.mentions.claims.includes(x))];
    if (co.length) out.push([A.id, B.id, co]);
  }
  return out;
}
function entNodeSVG(e){
  const [x, y] = EPOS[e.id];
  return `<g style="cursor:pointer" onclick="selectEnt('${e.id}')">
    <rect x="${x - G_ENT_W/2}" y="${y - G_ENT_H/2}" width="${G_ENT_W}" height="${G_ENT_H}" rx="8" fill="#fff"
      stroke="${e.orphan ? '#c9a95c' : '#2b5bd7'}" ${e.orphan ? 'stroke-dasharray="5 3"' : ''}/>
    <text x="${x}" y="${y - 2}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#222">${esc(e.name)}</text>
    <text x="${x}" y="${y + 15}" text-anchor="middle" font-size="9.5" fill="#888">${esc(e.type)} · 条目×${e.mentions.items.length} · 命题×${e.mentions.claims.length}</text>
  </g>`;
}
function graphSVG(){
  let s = '';
  entEdges().forEach(([a, b, co]) => {
    const [ax, ay] = EPOS[a], [bx, by] = EPOS[b];
    s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#cfcfcf" stroke-width="1.2"/>
          <text x="${(ax + bx)/2}" y="${(ay + by)/2 - 4}" text-anchor="middle" font-size="9.5" fill="#aaa">×${co.length}</text>`;
  });
  s += `<rect x="72" y="305" width="240" height="115" rx="10" fill="none" stroke="#c9a95c" stroke-dasharray="6 4"/>
        <text x="192" y="322" text-anchor="middle" font-size="10.5" fill="#8a6d1a">断连孤岛（不与激活需求 / 课题邻域连通）</text>`;
  DB.entities.forEach(e => { s += entNodeSVG(e); });
  return `<svg viewBox="0 0 990 440" style="width:100%;max-width:990px;display:block">${s}</svg>`;
}
function objectGraphSVG(){
  const N = (x, y, w, label, sub, color, href) => `
    <a href="${href}"><rect x="${x - w/2}" y="${y - 20}" width="${w}" height="40" rx="8" fill="#fff" stroke="${color}"/>
    <text x="${x}" y="${y - 3}" text-anchor="middle" font-size="12" font-weight="600" fill="#222">${esc(label)}</text>
    <text x="${x}" y="${y + 12}" text-anchor="middle" font-size="9.5" fill="#888">${esc(sub)}</text></a>`;
  const E = (x1, y1, x2, y2, label) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#cfcfcf" stroke-width="1.2"/>
    <text x="${(x1 + x2)/2 + 4}" y="${(y1 + y2)/2 - 4}" font-size="9.5" fill="#999">${label}</text>`;
  return `<svg viewBox="0 0 990 440" style="width:100%;max-width:990px;display:block">
    ${E(140,220,330,100,'分解')}${E(140,220,330,340,'分解')}
    ${E(330,100,520,100,'答案落成')}${E(330,340,520,340,'答案落成')}
    ${E(520,100,700,220,'合成证据')}${E(520,340,700,220,'合成证据')}
    ${E(520,100,865,100,'证据引用')}${E(520,340,865,340,'证据引用')}
    ${N(140,220,158,'T1 露天矿装车市场空间','研究课题 · 进行中','#2b5bd7','#/task/t1')}
    ${N(330,100,140,'T1a 单元存量法','子课题','#999','#/task/t1a')}
    ${N(330,340,140,'T1b 工作量产能法','子课题','#999','#/task/t1b')}
    ${N(520,100,150,'C1a 80–110 亿元','子结论 · 中','#2b5bd7','#/claim/c1a')}
    ${N(520,340,150,'C1b 95–125 亿元','假设','#999','#/claim/c1b')}
    ${N(700,220,158,'C1 装车市场空间','假设（待合成）','#2b5bd7','#/claim/c1')}
    ${N(865,100,140,'I1 交付量 +40%','已核实 B1','#999','#/item/i1')}
    ${N(865,340,140,'I2 中标 12 台','已核实 A2','#999','#/item/i2')}
  </svg>`;
}
function setGraphView(v){ UI.graphView = v; render(); }
function selectEnt(id){
  UI.graphSel = id;
  if (route().page !== 'graph') location.hash = '#/graph';
  render();
}
function orphanNewReq(id){
  const e = entOf(id); if (!e) return;
  PENDING_REQ = {name:'跟踪 ' + e.name + ' 动态', topics:e.name};
  location.hash = '#/reqs';
  render();
}
function entPanel(e){
  const srcs = DB.sources.filter(s => s.entity === e.id);
  return `
  <div class="box"><h2>${esc(e.name)} <span class="pill">${esc(e.type)}</span>${e.orphan ? ' <span class="pill dashed">断连孤岛</span>' : ''}</h2>
    <dl class="kv">
      <dt>别名</dt><dd>${e.aliases.join('、') || '—'}</dd>
      <dt>归并历史</dt><dd>${e.merges.map(m => `${esc(m.from)} → 本体（${esc(m.time)} · ${esc(m.note)}）`).join('；') || '—'}</dd>
      <dt>提及条目</dt><dd>${e.mentions.items.map(itemLink).join('、') || '—'}</dd>
      <dt>提及命题</dt><dd>${e.mentions.claims.map(claimLink).join('、') || '—'}</dd>
      <dt>挂接信源</dt><dd>${srcs.length ? srcs.map(s => `<a href="#/source/${s.id}">${esc(s.name)}</a><span class="muted">（信源侧 · doc-03 §六）</span>`).join('、') : '—'}</dd>
    </dl>
    ${e.orphan ? `
    <div class="muted" style="margin-top:8px">断连孤岛（新话题探测器 · doc-02 §3）：不命中任何激活情报需求、不与课题邻域连通——新话题或噪音，由消费方裁决。</div>
    <div class="fbrow"><button class="btn small primary" onclick="orphanNewReq('${e.id}')">声明新情报需求（预填实体）</button></div>` : ''}
  </div>`;
}
function renderGraph(){
  const sel = UI.graphSel ? entOf(UI.graphSel) : null;
  return `
  <h1 class="page">图谱</h1>
  <div class="sub">跨对象视图（doc-02 §3）：实体不设独立列表 / 详情页，由本页一页承载——节点点选看提及清单与归并历史。</div>
  <div class="sketch">
    <h2 style="font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${UI.graphView} <span class="sketch-tag">草图 · 实现时按真实数据重画</span></h2>
    <div class="chips"><span class="lbl">视图</span>${['实体视图','对象视图'].map(v =>
      `<span class="chip ${UI.graphView===v?'on':''}" onclick="setGraphView('${v}')">${v}</span>`).join('')}</div>
    ${UI.graphView === '实体视图' ? graphSVG() : objectGraphSVG()}
    <div class="muted" style="margin-top:6px">${UI.graphView === '实体视图'
      ? '点 = 实体（世界对象）；线 = 提及共现派生的关系边（投影，不落账）；实体不进判定链，归并不触发级联重估（doc-02 §3）。'
      : '系统对象图：问题树 · 命题合成 DAG · 证据引用——账本既有结构的图谱呈现。'}</div>
  </div>
  ${sel ? entPanel(sel) : '<div class="box"><div class="empty">点选实体节点，看提及清单与归并历史</div></div>'}`;
}
function mentionGraphSVGInner(kind, id){
  const ents = kind === 'item' ? itemEntities(id) : claimEntities(id);
  if (!ents.length) return '';
  const W = 740, rowH = 74, H = Math.max(190, 60 + ents.length * rowH);
  const pos = ents.map((e, i) => [W - 150, 56 + i * rowH]);
  const cx = 150, cy = H / 2;
  let s = `<rect x="${cx - 55}" y="${cy - 18}" width="110" height="36" rx="8" fill="#f0f3fb" stroke="#2b5bd7"/>
           <text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="12" font-weight="600" fill="#2b5bd7">${id.toUpperCase()}</text>`;
  const idx = Object.fromEntries(ents.map((e, i) => [e.id, i]));
  entEdges().forEach(([a, b]) => {
    if (idx[a] == null || idx[b] == null) return;
    const [ax, ay] = pos[idx[a]], [bx, by] = pos[idx[b]];
    s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#cfcfcf" stroke-width="1"/>`;
  });
  ents.forEach((e, i) => {
    const [x, y] = pos[i];
    s += `<line x1="${cx + 55}" y1="${cy}" x2="${x - 64}" y2="${y}" stroke="#2b5bd7" stroke-opacity=".45" stroke-dasharray="3 3"/>
          <g style="cursor:pointer" onclick="selectEnt('${e.id}')">
          <rect x="${x - 64}" y="${y - 19}" width="128" height="38" rx="8" fill="#fff" stroke="#2b5bd7"/>
          <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="600" fill="#222">${esc(e.name)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block">${s}</svg>
    <div class="muted">虚线 = 本${kind === 'item' ? '条目' : '命题'}挂载的实体提及；实体间连线 = 提及共现派生（投影，不落账）。点实体入<a href="#/graph">图谱页</a>（doc-02 §3）。</div>`;
}
function mentionGraphSVG(kind, id){
  const inner = mentionGraphSVGInner(kind, id);
  if (!inner) return '';
  return `
  <div class="sketch"><h2 style="font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center">关联图（实体提及 · 派生共现） <span class="sketch-tag">草图 · 实现时按真实数据重画</span></h2>
    ${inner}
  </div>`;
}

/* ================= 冷启动引导（首次启用 · 覆盖层） ================= */
function onboardOverlay(){
  if (!UI.onboard) return '';
  const confirmed = DB.sources.filter(s => s.status === '已确认').length;
  return `
  <div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="background:#fff;border-radius:10px;max-width:580px;width:100%;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto">
      <h2 style="margin:0 0 4px;font-size:17px">欢迎使用 IIH <span class="muted" style="font-weight:400;font-size:12px">冷启动引导 · 首次启用一次性</span></h2>
      <div class="muted" style="margin-bottom:12px">信源库为空时，定向智能体无途径可派采集任务（依赖信源与途径画像选途径，doc-06 §2）——先喂种子：</div>
      <ol style="margin:0 0 12px;padding-left:20px;line-height:2">
        <li><b>登记种子信源及途径</b>——一两个源头即可（如 W 公司 · 官网与公众号，新华社 · 官网；主体一登记、途径随手添，doc-03 §六）<a href="#/sources" onclick="dismissOnboard()">去登记 →</a></li>
        <li><b>声明首个情报需求并激活</b>——定向智能体开始按画像派采集任务 <a href="#/reqs" onclick="dismissOnboard()">去声明 →</a></li>
        <li><b>采集启动</b>——线索 → 审查 → 核实评级，核实后按命中需求分发</li>
        <li><b>滚雪球</b>——采集的池外自由探索（decision-05）发现关联信源，经确认扩大信源池</li>
      </ol>
      <div class="muted" style="margin-bottom:14px">出口：需求激活、采集启动，进入常驻监控（doc-07 §2.2）。本原型为运行态假数据（已确认信源 ${confirmed} 个），引导经右上角账户区 ▶ 重放。</div>
      <div style="display:flex;justify-content:flex-end"><button class="btn primary" onclick="dismissOnboard()">开始使用</button></div>
    </div>
  </div>`;
}
function showOnboard(){ UI.onboard = true; render(); }
function dismissOnboard(){ UI.onboard = false; render(); }

/* ================= 启动 ================= */
window.addEventListener('hashchange', render);
render();
</script>
