services:
  web-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://iih:iih@postgres:5432/iih
      FILE_STORAGE_DIR: /data/filestore
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - filestore:/data/filestore
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: iih
      POSTGRES_PASSWORD: iih
      POSTGRES_DB: iih
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iih -d iih"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  filestore:
