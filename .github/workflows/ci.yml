name: CI

on:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: iih
          POSTGRES_PASSWORD: iih
          POSTGRES_DB: iih
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iih -d iih"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://iih:iih@localhost:5432/iih

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src tests alembic

      - name: Ruff format check
        run: uv run ruff format --check src tests alembic

      - name: Mypy
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
